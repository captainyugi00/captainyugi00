name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate telemetry card
        run: node .github/scripts/telemetry.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "github-metrics.svg unchanged — nothing to commit"
          else
            git commit -m "telemetry: daily sync [skip ci]"
            git push
          fi
