name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: captainyugi00
          outputs: |
            dist/github-snake.svg?color_snake=%230E8A5F&color_dots=%23EBEDF0,%23B9F0DC,%236FE0B4,%232EBD87,%230E8A5F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2334D399&color_dots=%2310151D,%23123B2C,%231B6B4A,%2327A472,%2334D399

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
