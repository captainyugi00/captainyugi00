<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" width="420" height="430" role="img" aria-labelledby="cardm-title cardm-desc">
<title id="cardm-title">Inoue AI &#8212; production AI studio for creators &amp; agencies</title>
<desc id="cardm-desc">Flagship project card (mobile): Inoue AI. AI generation, captioning, scheduling, analytics and worker orchestration, with companion product Inoue Vault. Vertical pipeline: generate, caption, schedule, publish, with an analytics branch. Links: inoue.app and vault.inoue.app.</desc>
<style>
text{font-family:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){
* {animation:none !important}
.cardm-dot{opacity:0}
.cardm-node{stroke:#2A3242 !important}
}
</style>
<defs>
<filter id="cardm-shadow" x="0" y="0" width="420" height="430" filterUnits="userSpaceOnUse">
<feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
</filter>
</defs>

<!-- card -->
<rect x="12" y="12" width="396" height="406" rx="10" fill="#0D1420" filter="url(#cardm-shadow)"/>
<rect x="12.5" y="12.5" width="395" height="405" rx="10" fill="none" stroke="#263042" stroke-width="1"/>

<!-- TOP: copy -->
<text x="32" y="46" font-size="11" letter-spacing="2" fill="#34D399">&#9656; FLAGSHIP</text>
<text x="32" y="78" font-size="26" font-weight="700" fill="#E6EDF3">INOUE AI</text>
<text x="32" y="102" font-size="13" fill="#8B949E">production AI studio for creators &amp; agencies</text>

<text x="32" y="132" font-size="13" fill="#C9D1D9"><tspan fill="#34D399">&#9656;</tspan> AI generation <tspan fill="#6E7681">&#183;</tspan> captioning <tspan fill="#6E7681">&#183;</tspan> scheduling</text>
<text x="32" y="154" font-size="13" fill="#C9D1D9"><tspan fill="#34D399">&#9656;</tspan> analytics + worker orchestration</text>
<text x="32" y="176" font-size="13" fill="#C9D1D9"><tspan fill="#34D399">&#9656;</tspan> companion: Inoue Vault</text>

<text x="32" y="204" font-size="13" fill="#34D399">&#8599; inoue.app<tspan fill="#6E7681">  &#183;  </tspan>&#8599; vault.inoue.app</text>

<!-- BOTTOM: vertical pipeline hairlines -->
<g fill="none" stroke="#1C2433" stroke-width="1">
<line x1="210" y1="254" x2="210" y2="274"/>
<line x1="210" y1="304" x2="210" y2="324"/>
<line x1="210" y1="354" x2="210" y2="374"/>
<line x1="210" y1="364" x2="290" y2="364"/>
</g>

<!-- ambient packets: painted BEFORE the nodes so the dots pass UNDER the
     opaque node boxes (never over their label text) and only show on the
     connector lines -->
<circle class="cardm-dot" r="2" fill="#34D399">
<animateMotion dur="4s" repeatCount="indefinite" calcMode="paced" path="M210 239 V389"/>
</circle>
<circle class="cardm-dot" r="2" fill="#34D399" opacity="0.3">
<animateMotion dur="8s" repeatCount="indefinite" calcMode="paced" path="M210 239 V364 H335"/>
</circle>

<!-- BOTTOM: nodes -->
<g>
  <rect class="cardm-node" x="155" y="224" width="110" height="30" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#34D399;#2A3242" keyTimes="0;0.05" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect>
  <text x="210" y="243.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">generate</text>
</g>
<g>
  <rect class="cardm-node" x="155" y="274" width="110" height="30" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#2A3242;#34D399;#2A3242" keyTimes="0;0.3333;0.3833" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect>
  <text x="210" y="293.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">caption</text>
</g>
<g>
  <rect class="cardm-node" x="155" y="324" width="110" height="30" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#2A3242;#34D399;#2A3242" keyTimes="0;0.6667;0.7167" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect>
  <text x="210" y="343.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">schedule</text>
</g>
<g>
  <rect class="cardm-node" x="155" y="374" width="110" height="30" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#2A3242;#34D399" keyTimes="0;0.95" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect>
  <text x="210" y="393.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">publish</text>
</g>
<g>
<rect class="cardm-node" x="290" y="351" width="90" height="26" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#2A3242;#34D399" keyTimes="0;0.95" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<text x="335" y="368.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">analytics</text>
</g>
</svg>
