<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img">
<title>Inoue AI — production AI studio for creators &amp; agencies</title>
<desc>Flagship project card: Inoue AI. AI generation, captioning, scheduling, analytics and worker orchestration, with companion product Inoue Vault. Pipeline: generate, caption, schedule, publish, with an analytics branch. Links: inoue.app and vault.inoue.app.</desc>
<style>
text{font-family:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){
* {animation:none !important}
.card-dot{opacity:0}
.card-node{stroke:#2A3242 !important}
}
</style>
<defs>
<filter id="card-shadow" x="-6%" y="-24%" width="112%" height="148%">
<feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
</filter>
</defs>

<!-- card -->
<rect x="14" y="14" width="872" height="212" rx="10" fill="#0D1420" filter="url(#card-shadow)"/>
<rect x="14.5" y="14.5" width="871" height="211" rx="10" fill="none" stroke="#263042" stroke-width="1"/>

<!-- LEFT: copy -->
<text x="48" y="52" font-size="12" letter-spacing="2" fill="#34D399">&#9656; FLAGSHIP</text>
<text x="48" y="88" font-size="30" font-weight="700" fill="#E6EDF3">INOUE AI</text>
<text x="48" y="113" font-size="15" fill="#8B949E">production AI studio for creators &amp; agencies</text>

<text x="48" y="144" font-size="14" fill="#C9D1D9"><tspan fill="#34D399">&#9656;</tspan> AI generation <tspan fill="#6E7681">&#183;</tspan> captioning <tspan fill="#6E7681">&#183;</tspan> scheduling</text>
<text x="48" y="167" font-size="14" fill="#C9D1D9"><tspan fill="#34D399">&#9656;</tspan> analytics + worker orchestration</text>
<text x="48" y="190" font-size="14" fill="#C9D1D9"><tspan fill="#34D399">&#9656;</tspan> companion: Inoue Vault</text>

<text x="48" y="215" font-size="13" fill="#34D399">&#8599; inoue.app<tspan fill="#6E7681">  &#183;  </tspan>&#8599; vault.inoue.app</text>

<!-- RIGHT: pipeline hairlines -->
<g fill="none" stroke="#1C2433" stroke-width="1">
<line x1="653" y1="63" x2="733" y2="63"/>
<path d="M778 80 V99 H608 V118"/>
<line x1="653" y1="135" x2="733" y2="135"/>
<line x1="693" y1="135" x2="693" y2="172"/>
</g>

<!-- ambient packets: painted BEFORE the nodes so the dots pass UNDER the
     opaque node boxes (never over their label text) and only show on the
     connector lines -->
<circle class="card-dot" r="2" fill="#34D399">
<animateMotion dur="4s" repeatCount="indefinite" calcMode="paced" path="M608 63 H778 V99 H608 V135 H778"/>
</circle>
<circle class="card-dot" r="2" fill="#34D399" opacity="0.3">
<animateMotion dur="8s" repeatCount="indefinite" calcMode="paced" path="M608 63 H778 V99 H608 V135 H693 V186"/>
</circle>

<!-- RIGHT: nodes -->
<g>
  <rect class="card-node" x="563" y="46" width="90" height="34" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#34D399;#2A3242" keyTimes="0;0.05" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect>
  <text x="608" y="67.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">generate</text>
</g>
<g>
  <rect class="card-node" x="733" y="46" width="90" height="34" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#2A3242;#34D399;#2A3242" keyTimes="0;0.2921;0.3421" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect>
  <text x="778" y="67.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">caption</text>
</g>
<g>
  <rect class="card-node" x="563" y="118" width="90" height="34" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#2A3242;#34D399;#2A3242" keyTimes="0;0.7079;0.7579" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect>
  <text x="608" y="139.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">schedule</text>
</g>
<g>
  <rect class="card-node" x="733" y="118" width="90" height="34" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#2A3242;#34D399" keyTimes="0;0.95" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect>
  <text x="778" y="139.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">publish</text>
</g>
<g>
<rect class="card-node" x="658" y="172" width="70" height="28" rx="6" fill="#0A0E16" stroke="#2A3242" stroke-width="1"><animate attributeName="stroke" values="#2A3242;#34D399" keyTimes="0;0.95" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<text x="693" y="190.5" text-anchor="middle" font-size="12.5" fill="#C9D1D9">analytics</text>
</g>
</svg>
