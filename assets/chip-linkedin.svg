<rect x="1" y="1" width="194" height="42" rx="12" fill="#0E1420"/><rect x="20" y="14" width="16" height="16" rx="3" fill="#0A66C2"/><text class="m" x="28" y="26" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">in</text>
