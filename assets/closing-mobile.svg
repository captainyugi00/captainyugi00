<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 128" width="420" height="128" role="img" aria-labelledby="t d">
<title id="t">Closing note</title>
<desc id="d">A pull quote: "Tell me, why do you choose to be ordinary?" attributed to Sosuke Aizen.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif}
.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes fx-in{from{opacity:0}to{opacity:1}}
@keyframes fx-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.fx-i{animation:fx-in .55s ease both}

@media (prefers-reduced-motion:reduce){
*{animation:none!important;animation-delay:0s!important}
.fx-loop{display:none}
}
</style>
<defs>
<filter id="sh" x="-6%" y="-14%" width="112%" height="128%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/></filter>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.75" fill="#FFFFFF" fill-opacity="0.032"/></pattern>
<linearGradient id="sheen" x1="-0.35" y1="0" x2="-0.05" y2="0">
<stop offset="0" stop-color="#34D399" stop-opacity="0"/><stop offset="0.5" stop-color="#34D399" stop-opacity="0.11"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
<animate attributeName="x1" values="-0.35;1" dur="11s" repeatCount="indefinite"/><animate attributeName="x2" values="-0.05;1.3" dur="11s" repeatCount="indefinite"/>
</linearGradient>

</defs>
<rect x="6" y="6" width="408" height="116" rx="14" fill="#0E1420" filter="url(#sh)"/>
<rect x="24" y="30" width="3" height="66" rx="1.5" fill="#34D399"><animate attributeName="height" from="0" to="66" begin="0.3s" dur="0.6s" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1" fill="freeze"/></rect>
<text class="fx-i" x="42" y="52" font-size="16" font-style="italic" fill="#C7D0DA" style="animation-delay:0.4s">&#8220;Tell me, why do you choose</text>
<text class="fx-i" x="42" y="78" font-size="16" font-style="italic" fill="#C7D0DA" style="animation-delay:0.48s">to be ordinary?&#8221;</text>
<text class="m fx-i" x="42" y="108" font-size="10" letter-spacing="2" fill="#6B7684" text-anchor="start" style="animation-delay:0.6s">S&#332;SUKE AIZEN</text>
<rect x="6.5" y="6.5" width="407" height="115" rx="14" fill="none" stroke="#242E3E" stroke-width="1"/>
</svg>
