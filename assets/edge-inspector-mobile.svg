<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img">
<title>~/edge &#8212; packet inspector</title>
<desc>Terminal packet-inspector card, mobile layout. Three captured frames stacked: CLIENT_HELLO with JA3 fingerprint and GREASE on, HTTP/2 SETTINGS with custom frame order, and a verdict of handshake clean, allowed through. A scan highlight steps across the entries.</desc>
<style>
text{font-family:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
#eim-tick{animation:eim-pulse 6s linear infinite}
@keyframes eim-pulse{0%,49.9%{fill-opacity:1}50%{fill-opacity:.5}64%,100%{fill-opacity:1}}
@media (prefers-reduced-motion: reduce){
* {animation:none !important}
#eim-scan{display:none}
}
</style>
<defs>
<filter id="eim-shadow" x="-12%" y="-20%" width="124%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
</filter>
</defs>

<!-- card -->
<rect x="12" y="12" width="396" height="236" rx="10" fill="#0D1420" filter="url(#eim-shadow)"/>

<!-- capture entries: zebra fill behind 01 and 03 -->
<rect x="13" y="48" width="394" height="56" fill="#FFFFFF" fill-opacity="0.03"/>
<rect x="13" y="176" width="394" height="56" fill="#FFFFFF" fill-opacity="0.03"/>

<!-- scan highlight (one motion): steps entry1 -> entry2 -> entry3, 6s loop; base = entry 3 fallback -->
<rect id="eim-scan" x="13" y="176" width="394" height="56" fill="#34D399" fill-opacity="0.06">
<animate attributeName="y" values="48;112;176;48" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
</rect>

<!-- header (strict card spec: title only, no counter label, no hairline) -->
<text x="30" y="35" font-size="12" fill="#6E7681">~/edge &#8212; packet inspector</text>

<!-- entries: stacked, label line + value line -->
<text x="30" y="68" font-size="11" fill="#6E7681">01 CLIENT_HELLO</text>
<text x="30" y="88" font-size="13" fill="#C9D1D9">ja3=771,4865-4866... &#183; grease=ON</text>

<text x="30" y="132" font-size="11" fill="#6E7681">02 SETTINGS</text>
<text x="30" y="152" font-size="13" fill="#C9D1D9">h2 &#183; HEADER_TABLE_SIZE=65536 &#183; custom order</text>

<text x="30" y="196" font-size="11" fill="#6E7681">03 VERDICT</text>
<text x="30" y="216" font-size="13" fill="#34D399">handshake clean &#8212; allowed through <tspan id="eim-tick">&#10003;</tspan></text>

<!-- border on top for a crisp 1px edge -->
<rect x="12.5" y="12.5" width="395" height="235" rx="10" fill="none" stroke="#263042" stroke-width="1"/>
</svg>
