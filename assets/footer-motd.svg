<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 125" width="900" height="125" role="img" aria-label="&quot;Tell me, why do you choose to be ordinary?&quot; — Sōsuke Aizen">
<title>operator@inoue — /etc/motd</title>
<desc>Terminal footer strip. A shell prompt types "cat /etc/motd" and the message of the day fades in word by word: "Tell me, why do you choose to be ordinary?" — Sōsuke Aizen. A block cursor blinks at the end.</desc>
<style>
.motd-t{font-family:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
.motd-c{animation:motd-in .5s steps(1,start) both}
.motd-w{animation:motd-in .25s ease both}
.motd-k{font-style:normal;animation:motd-in .25s ease 2.27s both,motd-blink 1.06s steps(1,end) 2.5s infinite}
@keyframes motd-in{from{opacity:0}to{opacity:1}}
@keyframes motd-blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="motd-sh" x="-5%" y="-45%" width="110%" height="190%">
<feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
<feOffset dy="4" result="motd-o"/>
<feFlood flood-color="#000000" flood-opacity="0.2"/>
<feComposite in2="motd-o" operator="in"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect x="14" y="14" width="872" height="97" rx="8" fill="#0A0E16" stroke="#263042" stroke-width="1" filter="url(#motd-sh)"/>
<text class="motd-t" x="139" y="52" font-size="13" fill="#6E7681"><tspan class="motd-c" style="animation-delay:.05s">o</tspan><tspan class="motd-c" style="animation-delay:.095s">p</tspan><tspan class="motd-c" style="animation-delay:.14s">e</tspan><tspan class="motd-c" style="animation-delay:.185s">r</tspan><tspan class="motd-c" style="animation-delay:.23s">a</tspan><tspan class="motd-c" style="animation-delay:.275s">t</tspan><tspan class="motd-c" style="animation-delay:.32s">o</tspan><tspan class="motd-c" style="animation-delay:.365s">r</tspan><tspan class="motd-c" style="animation-delay:.41s">@</tspan><tspan class="motd-c" style="animation-delay:.455s">i</tspan><tspan class="motd-c" style="animation-delay:.5s">n</tspan><tspan class="motd-c" style="animation-delay:.545s">o</tspan><tspan class="motd-c" style="animation-delay:.59s">u</tspan><tspan class="motd-c" style="animation-delay:.635s">e</tspan><tspan class="motd-c" style="animation-delay:.68s">:</tspan><tspan class="motd-c" style="animation-delay:.725s">~</tspan><tspan class="motd-c" style="animation-delay:.77s"> </tspan><tspan class="motd-c" style="animation-delay:.815s">$</tspan><tspan class="motd-c" style="animation-delay:.86s"> </tspan><tspan class="motd-c" style="animation-delay:.905s">c</tspan><tspan class="motd-c" style="animation-delay:.95s">a</tspan><tspan class="motd-c" style="animation-delay:.995s">t</tspan><tspan class="motd-c" style="animation-delay:1.04s"> </tspan><tspan class="motd-c" style="animation-delay:1.085s">/</tspan><tspan class="motd-c" style="animation-delay:1.13s">e</tspan><tspan class="motd-c" style="animation-delay:1.175s">t</tspan><tspan class="motd-c" style="animation-delay:1.22s">c</tspan><tspan class="motd-c" style="animation-delay:1.265s">/</tspan><tspan class="motd-c" style="animation-delay:1.31s">m</tspan><tspan class="motd-c" style="animation-delay:1.355s">o</tspan><tspan class="motd-c" style="animation-delay:1.4s">t</tspan><tspan class="motd-c" style="animation-delay:1.445s">d</tspan></text>
<text class="motd-t" x="139" y="79" font-size="17" font-style="italic" fill="#C9D1D9"><tspan class="motd-w" style="animation-delay:1.1s">"Tell </tspan><tspan class="motd-w" style="animation-delay:1.19s">me, </tspan><tspan class="motd-w" style="animation-delay:1.28s">why </tspan><tspan class="motd-w" style="animation-delay:1.37s">do </tspan><tspan class="motd-w" style="animation-delay:1.46s">you </tspan><tspan class="motd-w" style="animation-delay:1.55s">choose </tspan><tspan class="motd-w" style="animation-delay:1.64s">to </tspan><tspan class="motd-w" style="animation-delay:1.73s">be </tspan><tspan class="motd-w" style="animation-delay:1.82s">ordinary?" </tspan><tspan class="motd-w" fill="#34D399" style="animation-delay:2s">— </tspan><tspan class="motd-w" fill="#34D399" style="animation-delay:2.09s">Sōsuke </tspan><tspan class="motd-w" fill="#34D399" style="animation-delay:2.18s">Aizen </tspan><tspan class="motd-k" fill="#34D399">▊</tspan></text>
</svg>
