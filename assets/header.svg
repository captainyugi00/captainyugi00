<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="t d">
<title id="t">Paolo Vergani &#8212; software engineer, security researcher, founder</title>
<desc id="d">Profile header. Paolo Vergani, software engineer, security researcher and founder, based in Rome, Italy, based in Rome, Italy, founder of Inoue AI, available for select work.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif}
.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes fx-in{from{opacity:0}to{opacity:1}}
@keyframes fx-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.fx-i{animation:fx-in .55s ease both}

@media (prefers-reduced-motion:reduce){
*{animation:none!important;animation-delay:0s!important}
.fx-loop{display:none}
}
</style>
<defs>
<filter id="sh" x="-6%" y="-14%" width="112%" height="128%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/></filter>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.75" fill="#FFFFFF" fill-opacity="0.032"/></pattern>
<linearGradient id="sheen" x1="-0.35" y1="0" x2="-0.05" y2="0">
<stop offset="0" stop-color="#34D399" stop-opacity="0"/><stop offset="0.5" stop-color="#34D399" stop-opacity="0.11"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
<animate attributeName="x1" values="-0.35;1" dur="11s" repeatCount="indefinite"/><animate attributeName="x2" values="-0.05;1.3" dur="11s" repeatCount="indefinite"/>
</linearGradient>
<clipPath id="clip"><rect x="8" y="8" width="864" height="264" rx="14"/></clipPath>
<clipPath id="wipe"><rect x="34" y="66" width="880" height="72"><animate attributeName="width" from="0" to="880" begin="0.45s" dur="0.75s" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1" fill="freeze"/></rect></clipPath>
</defs>
<rect x="8" y="8" width="864" height="264" rx="14" fill="#0B0F17" filter="url(#sh)"/>
<g clip-path="url(#clip)">
<rect x="8" y="8" width="864" height="264" fill="url(#grid)"/>
<rect class="fx-loop" x="8" y="8" width="864" height="264" fill="url(#sheen)"/>
</g>

<g class="fx-i" style="animation-delay:0.9s">
<rect x="635" y="46" width="205" height="26" rx="13" fill="#34D399" fill-opacity="0.1" stroke="#34D399" stroke-opacity="0.35"/>
<circle class="fx-loop" cx="651" cy="59" r="3.5" fill="#34D399" style="animation:fx-pulse 2.6s ease-in-out infinite"/>
<circle cx="651" cy="59" r="3.5" fill="#34D399" opacity="0.001"/>
<text class="m" x="663" y="63" font-size="11" fill="#34D399">Available for select work</text>
</g>

<text class="m fx-i" x="40" y="68" font-size="11" letter-spacing="2.6" fill="#34D399" text-anchor="start" style="animation-delay:0.2s">SOFTWARE ENGINEER &#160;&#183;&#160; SECURITY RESEARCHER &#160;&#183;&#160; FOUNDER</text>

<g clip-path="url(#wipe)"><text x="40" y="126" font-size="52" font-weight="700" fill="#F0F4F8" letter-spacing="-0.5">Paolo Vergani</text></g>
<rect x="40" y="146" width="92" height="3" rx="1.5" fill="#34D399"><animate attributeName="width" from="0" to="92" begin="0.95s" dur="0.6s" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1" fill="freeze"/></rect>

<text class="fx-i" x="40" y="186" font-size="17" fill="#C7D0DA" style="animation-delay:1s">I build production systems where performance, security and scale</text>
<text class="fx-i" x="40" y="210" font-size="17" fill="#C7D0DA" style="animation-delay:1.08s">are the actual requirements, not aspirations.</text>
<text class="m fx-i" x="40" y="244" font-size="12" fill="#6B7684" style="animation-delay:1.25s">Rome, Italy &#160;&#160;&#183;&#160;&#160; Founder of Inoue AI &#160;&#160;&#183;&#160;&#160; Consulting and collaboration welcome</text>

<rect x="8.5" y="8.5" width="863" height="263" rx="14" fill="none" stroke="#242E3E" stroke-width="1"/>
</svg>
