<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 384" width="880" height="384" role="img" aria-labelledby="t d">
<title id="t">Selected work</title>
<desc id="d">Six project summaries: a Rust protocol research suite, a high-throughput Rust engine, a privacy-preserving fingerprint platform, a multi-service AI studio platform, a multi-tenant Go SaaS backend, and a combined mobile and backend product suite.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif}
